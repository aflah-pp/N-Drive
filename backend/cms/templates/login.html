{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — ControlPanel</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
  </head>
  <body>
    <div class="login-card">
      <h2>Secure Gateway</h2>
      <p class="subtitle">Enter your credentials to access the workspace</p>

      {% if form.errors %}
      <div class="error-banner">
        The credentials provided do not match our records. Please try again.
      </div>
      {% endif %}

      <form method="post" action="{% url 'cms:login' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="usernameField">Username</label>
          <input
            type="text"
            name="username"
            id="usernameField"
            required
            autocomplete="username"
            autofocus
            placeholder="Enter your username"
          />
        </div>

        <div class="form-group">
          <label for="passwordField">Password</label>
          <input
            type="password"
            name="password"
            id="passwordField"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
          />
        </div>

        <button type="submit">Unlock Workspace</button>
      </form>
    </div>
  </body>
</html>
